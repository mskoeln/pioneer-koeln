name: Statistik aktualisieren

on:
  schedule:
    # Taeglich 03:17 UTC. GitHub fuehrt geplante Laeufe manchmal verspaetet aus,
    # das ist hier unkritisch.
    - cron: "17 3 * * *"
  workflow_dispatch:        # erlaubt den Start per Knopfdruck
  push:
    branches: [main]
    paths:
      - template.html       # Layoutaenderung -> Seite neu bauen
      - build.py

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seite aus der Google-Tabelle bauen
        run: python build.py

      - name: Aenderung committen
        run: |
          if git diff --quiet -- index.html; then
            echo "Keine Aenderung an index.html — nichts zu tun."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Statistik aktualisiert ($(date -u '+%Y-%m-%d'))"
          git push
